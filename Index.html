<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 Snake Oyunu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Arial', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: white;
    overflow: hidden;
    touch-action: none;
  }
  h1 { margin: 10px; font-size: 28px; text-shadow: 0 0 10px #00ff88; }
  #score { font-size: 20px; margin: 5px; color: #00ff88; }
  canvas {
    background: #0a0a1a;
    border: 3px solid #00ff88;
    border-radius: 10px;
    box-shadow: 0 0 20px #00ff88;
    max-width: 95vw;
    max-height: 70vh;
  }
  #controls {
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px 60px;
    gap: 5px;
    margin-top: 15px;
  }
  button {
    background: rgba(0, 255, 136, 0.2);
    border: 2px solid #00ff88;
    color: #00ff88;
    font-size: 24px;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
  }
  button:active { background: #00ff88; color: #0a0a1a; }
  #gameOver {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    padding: 30px;
    border-radius: 15px;
    border: 2px solid #ff0055;
    text-align: center;
    z-index: 10;
  }
  #gameOver h2 { color: #ff0055; margin-bottom: 15px; }
  #restartBtn {
    background: #00ff88;
    color: #0a0a1a;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    font-size: 18px;
    margin-top: 10px;
  }
  #startScreen {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  #startScreen h1 { font-size: 40px; margin-bottom: 20px; }
  #startBtn {
    background: #00ff88;
    color: #0a0a1a;
    padding: 15px 40px;
    border: none;
    border-radius: 10px;
    font-size: 22px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="startScreen">
  <h1>🐍 Snake</h1>
  <p style="margin-bottom: 20px;">Telefon: düymələri bas · Kompüter: ox klaviaturası</p>
  <button id="startBtn">BAŞLA</button>
</div>

<h1>🐍 Snake Oyunu</h1>
<div id="score">Xal: 0</div>
<canvas id="game" width="400" height="400"></canvas>

<div id="controls">
  <div></div>
  <button id="up">⬆️</button>
  <div></div>
  <button id="left">⬅️</button>
  <div></div>
  <button id="right">➡️</button>
  <div></div>
  <button id="down">⬇️</button>
  <div></div>
</div>

<div id="gameOver">
  <h2>Oyun Bitdi!</h2>
  <p id="finalScore">Xal: 0</p>
  <button id="restartBtn">Yenidən Oyna</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const gameOverEl = document.getElementById('gameOver');
const finalScoreEl = document.getElementById('finalScore');
const startScreen = document.getElementById('startScreen');

const grid = 20;
let snake, food, dx, dy, score, gameLoop, gameRunning = false;

function init() {
  snake = [{x: 200, y: 200}, {x: 180, y: 200}, {x: 160, y: 200}];
  dx = 20; dy = 0;
  score = 0;
  scoreEl.textContent = 'Xal: 0';
  placeFood();
  gameOverEl.style.display = 'none';
  gameRunning = true;
}

function placeFood() {
  food = {
    x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
    y: Math.floor(Math.random() * (canvas.height / grid)) * grid
  };
}

function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Yemək
  ctx.fillStyle = '#ff0055';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#ff0055';
  ctx.beginPath();
  ctx.arc(food.x + grid/2, food.y + grid/2, grid/2 - 2, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // İlan
  snake.forEach((s, i) => {
    if (i === 0) {
      ctx.fillStyle = '#00ff88';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ff88';
    } else {
      ctx.fillStyle = '#00cc6a';
      ctx.shadowBlur = 0;
    }
    ctx.fillRect(s.x + 1, s.y + 1, grid - 2, grid - 2);
    
    // Baş göz
    if (i === 0) {
      ctx.fillStyle = '#0a0a1a';
      ctx.shadowBlur = 0;
      ctx.fillRect(s.x + 5, s.y + 5, 3, 3);
      ctx.fillRect(s.x + 12, s.y + 5, 3, 3);
    }
  });
  ctx.shadowBlur = 0;
}

function update() {
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  
  // Divar
  if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
    return endGame();
  }
  
  // Özünə dəyir
  for (let s of snake) {
    if (head.x === s.x && head.y === s.y) return endGame();
  }
  
  snake.unshift(head);
  
  // Yemək yedikdə
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = 'Xal: ' + score;
    placeFood();
  } else {
    snake.pop();
  }
}

function endGame() {
  gameRunning = false;
  clearInterval(gameLoop);
  finalScoreEl.textContent = 'Xal: ' + score;
  gameOverEl.style.display = 'block';
}

function startGame() {
  init();
  startScreen.style.display = 'none';
  gameLoop = setInterval(() => {
    if (gameRunning) {
      update();
      draw();
    }
  }, 120);
}

// Klaviatura
document.addEventListener('keydown', e => {
  if (!gameRunning) return;
  if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -20; }
  if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 20; }
  if (e.key === 'ArrowLeft' && dx === 0) { dx = -20; dy = 0; }
  if (e.key === 'ArrowRight' && dx === 0) { dx = 20; dy = 0; }
});

// Düymələr
document.getElementById('up').onclick = () => { if (dy === 0) { dx = 0; dy = -20; }};
document.getElementById('down').onclick = () => { if (dy === 0) { dx = 0; dy = 20; }};
document.getElementById('left').onclick = () => { if (dx === 0) { dx = -20; dy = 0; }};
document.getElementById('right').onclick = () => { if (dx === 0) { dx = 20; dy = 0; }};

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;

// Ekrana basıb sürükləmə ilə də idarə et
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
canvas.addEventListener('touchend', e => {
  if (!gameRunning) return;
  const dx2 = e.changedTouches[0].clientX - touchStartX;
  const dy2 = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx2) > Math.abs(dy2)) {
    if (dx2 > 20 && dx === 0) { dx = 20; dy = 0; }
    else if (dx2 < -20 && dx === 0) { dx = -20; dy = 0; }
  } else {
    if (dy2 > 20 && dy === 0) { dx = 0; dy = 20; }
    else if (dy2 < -20 && dy === 0) { dx = 0; dy = -20; }
  }
});
</script>
</body>
  </html>
